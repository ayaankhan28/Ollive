apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: ollive
spec:
  # 3 replicas = 3 consumers in ingestion-workers group
  # Each pod gets unique hostname → unique consumer name in Redis
  replicas: 3
  selector:
    matchLabels:
      app: ingestion
  template:
    metadata:
      labels:
        app: ingestion
    spec:
      containers:
      - name: ingestion
        image: ghcr.io/ayaankhan28/ollive-ingestion:latest
        # Override entrypoint: skip --reload for production
        command: ["sh", "-c"]
        args: ["alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8001 --workers 1"]
        ports:
        - containerPort: 8001
        envFrom:
        - configMapRef:
            name: ollive-config
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion
  namespace: ollive
spec:
  selector:
    app: ingestion
  ports:
  - port: 8001
    targetPort: 8001
    nodePort: 30801
  type: NodePort
