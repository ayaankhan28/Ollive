apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ollive
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/ayaankhan28/ollive-backend:latest
        command: ["sh", "-c"]
        args: ["alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"]
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: ollive-config
        env:
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: ollive-secrets
              key: ANTHROPIC_API_KEY
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ollive-secrets
              key: GEMINI_API_KEY
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ollive-secrets
              key: OPENAI_API_KEY
        resources:
          requests:
            cpu: 150m
            memory: 256Mi
          limits:
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ollive
spec:
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30800
  type: NodePort
