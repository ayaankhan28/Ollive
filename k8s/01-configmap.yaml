apiVersion: v1
kind: ConfigMap
metadata:
  name: ollive-config
  namespace: ollive
data:
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/ollive_chat"
  REDIS_URL: "redis://redis:6379/0"
  OBSERVE_ME_ENDPOINT: "http://ingestion:8001"
  ANTHROPIC_MODEL: "claude-sonnet-4-6"
  ANTHROPIC_MAX_TOKENS: "8096"
  GEMINI_MODEL: "gemini-2.5-flash"
  GEMINI_MAX_TOKENS: "8096"
  OPENAI_MODEL: "gpt-4o-mini"
  OPENAI_MAX_TOKENS: "8096"
