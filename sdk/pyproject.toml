[tool.poetry]
name = "observe-me"
version = "0.1.0"
description = "LLM observability and tracing SDK — instrument any LLM call with one line"
authors = ["Ayaan Khan"]
packages = [{include = "observe_me"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
httpx = "^0.27.0"
pydantic = "^2.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
